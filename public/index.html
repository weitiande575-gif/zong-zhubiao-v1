<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>总主表 V1</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f5f6f8;
  margin:0;
  padding:16px;
}
.box{
  max-width:600px;
  margin:auto;
}
.header{
  background:#172333;
  color:white;
  padding:22px;
  border-radius:12px;
  text-align:center;
}
.card{
  background:white;
  padding:16px;
  margin-top:15px;
  border-radius:12px;
}
input,button{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin-top:10px;
  font-size:16px;
  border-radius:8px;
}
input{
  border:1px solid #ccc;
}
button{
  border:0;
  background:#168ad0;
  color:white;
  font-weight:bold;
}
pre{
  white-space:pre-wrap;
  word-break:break-all;
}
.ok{color:green;}
.error{color:red;}
</style>
</head>

<body>

<div class="box">

<div class="header">
  <h2>🎯 总主表</h2>
  <div>Master API V1</div>
</div>

<div class="card">
  <h3>① 创建批次</h3>

  <input
    id="batchName"
    placeholder="例如：271期测试"
  >
<select id="periodMode">
  <option value="SINGLE">单期</option>
  <option value="RANGE">连续多期</option>
</select>

<input
  id="startPeriod"
  type="number"
  placeholder="开始期，例如：250"
>

<input
  id="endPeriod"
  type="number"
  placeholder="结束期，例如：274"
>
  <button onclick="createBatch()">
    创建批次
  </button>

  <pre id="createResult"></pre>
</div>

<div class="card">
  <h3>② 当前批次</h3>

  <button onclick="loadBatches()">
    刷新批次
  </button>

  <pre id="batchList"></pre>
</div>
<div class="card">
  <h3>③ 上传图片</h3>

  <input
    id="uploadBatchId"
    type="number"
    placeholder="输入批次ID，例如：6"
  >

  <input
    id="imageFiles"
    type="file"
    accept="image/*"
    multiple
  >

  <button onclick="uploadImages()">
    上传图片
  </button>

  <pre id="uploadResult"></pre>
</div>
<div class="card">
  <h3>④ 领取识别任务</h3>

  <input
    id="claimBatchId"
    type="number"
    placeholder="输入批次ID，例如：7"
  >

  <button onclick="claimRecognitionJob()">
    领取一张待识别图片
  </button>

  <pre id="claimResult"></pre>
</div>

<div class="card">
  <h3>⑤ 系统状态</h3>

  <button onclick="checkHealth()">
    检查系统
  </button>

  <pre id="health"></pre>
</div>
  

  
    
    
    
  

  <button onclick="claimRecognitionJob()">
    领取一张待识别图片
  </button>

  <pre id="claimResult"></pre>
</div>
  <div class="card">
  <h3>④ 系统状态</h3>

  <button onclick="checkHealth()">
    检查系统
  </button>

  <pre id="health"></pre>
</div>

</div>

<script>

const API = "";

async function createBatch(){

  const name =
    document.getElementById("batchName")
      .value.trim();
const periodMode =
  document.getElementById("periodMode").value;

const startPeriod =
  document.getElementById("startPeriod").value.trim();

const endPeriod =
  document.getElementById("endPeriod").value.trim();
  const result =
    document.getElementById("createResult");

  if(!name){
    result.textContent="请输入批次名称";
    return;
  }

  result.textContent="正在创建...";

  try{

    const response =
      await fetch(API + "/api/batches",{
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
  batch_name:name,
  period_mode:periodMode,
  start_period:
    startPeriod === "" ? null : Number(startPeriod),
  end_period:
    endPeriod === "" ? null : Number(endPeriod)
})
          
        
      });

    const data =
      await response.json();

    result.textContent =
      JSON.stringify(data,null,2);

    result.className =
      response.ok ? "ok" : "error";

    if(response.ok){
      await loadBatches();
    }

  }catch(error){

    result.className="error";
    result.textContent=String(error);

  }
}
async function uploadImages(){

  const batchId =
    document.getElementById("uploadBatchId")
      .value.trim();

  const files =
    document.getElementById("imageFiles").files;

  const result =
    document.getElementById("uploadResult");

  if(!batchId){
    result.className="error";
    result.textContent="请输入批次ID";
    return;
  }

  if(!files || files.length === 0){
    result.className="error";
    result.textContent="请选择图片";
    return;
  }

  result.className="";
  result.textContent=
    `正在上传 ${files.length} 张图片...`;

  try{

    const formData = new FormData();

    formData.append("batch_id",batchId);

    for(const file of files){
      formData.append("files",file);
    }

    const response =
      await fetch(API + "/api/images/upload",{
        method:"POST",
        body:formData
      });

    const data =
      await response.json();

    result.textContent =
      JSON.stringify(data,null,2);

    result.className =
      response.ok ? "ok" : "error";

  }catch(error){

    result.className="error";
    result.textContent=String(error);

  }
}
async function claimRecognitionJob(){

  const batchId =
    document.getElementById("claimBatchId")
      .value.trim();

  const result =
    document.getElementById("claimResult");

  if(!batchId){
    result.className="error";
    result.textContent="请输入批次ID";
    return;
  }

  result.className="";
  result.textContent="正在领取待识别图片...";

  try{

    const response =
      await fetch(API + "/api/recognition/claim",{
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          batch_id:Number(batchId)
        })
      });

    const data =
      await response.json();

    result.textContent =
      JSON.stringify(data,null,2);

    result.className =
      response.ok ? "ok" : "error";

  }catch(error){

    result.className="error";
    result.textContent=String(error);

  }
}
  async function loadBatches(){

  const box =
    document.getElementById("batchList");

  box.textContent="正在读取...";

  try{

    const response =
      await fetch(API + "/api/batches");

    const data =
      await response.json();

    box.textContent =
      JSON.stringify(data,null,2);

  }catch(error){

    box.textContent=String(error);

  }
}

async function checkHealth(){

  const box =
    document.getElementById("health");

  box.textContent="正在检查...";

  try{

    const response =
      await fetch(API + "/health");

    const data =
      await response.json();

    box.textContent =
      JSON.stringify(data,null,2);

    box.className =
      data.ok ? "ok" : "error";

  }catch(error){

    box.className="error";
    box.textContent=String(error);

  }
}

loadBatches();
checkHealth();

</script>

</body>
</html>
